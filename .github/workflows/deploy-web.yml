name: Deploy Web

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8.11.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm typecheck

      - name: 构建 shader-playground 包
        # 必须先构建，apps/web 引用 @lucascv/shaderpad-playground 的 CSS / .d.ts
        working-directory: packages/shader-playground
        run: pnpm build

      - name: 构建 web
        # 显式 cd 到 apps/web（不依赖 package.json 的 prebuild 钩子）
        working-directory: apps/web
        run: pnpm build
        env:
          PUBLIC_SITE_URL: https://shaderpad.lucaslib.net
          PUBLIC_GA_MEASUREMENT_ID: ${{ secrets.PUBLIC_GA_MEASUREMENT_ID }}

      - name: 部署到服务器
        uses: burnett01/rsync-deployments@5.2
        with:
          switches: -avz --delete
          path: apps/web/dist/
          remote_path: /var/www/shaderpad/dist/
          remote_host: ${{ secrets.SSH_HOST }}
          remote_user: ${{ secrets.SSH_USERNAME }}
          remote_key: ${{ secrets.DEPLOY_KEY }}
